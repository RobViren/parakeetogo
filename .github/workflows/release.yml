name: release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            cmake: -DPK_STATIC=ON
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            cmake: -DPK_STATIC=ON
          - name: android-aarch64
            runner: ubuntu-24.04
            cmake: -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq clang ninja-build
      - uses: actions/cache@v4
        with:
          path: model
          key: model-${{ hashFiles('CMakeLists.txt') }}
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPK_EMBED=ON -DCMAKE_EXE_LINKER_FLAGS=-s ${{ matrix.cmake }}
      - run: cmake --build build
      - run: |
          test -s model/model.safetensors
          mv build/pk pk-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: pk-${{ matrix.name }}
          path: pk-${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" pk-* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
