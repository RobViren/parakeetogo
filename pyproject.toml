[project]
name = "parakeetogo"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "safetensors", "tokenizers"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
